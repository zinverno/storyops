schemaVersion: 1
id: postmortem
version: 1.0.0
displayName: Postmortem
description: >-
  What went wrong, how it was noticed, why it happened and what changed so it
  does not happen again. Blameless, precise about timeline and impact, honest
  about what is still unknown.
perspective: first-person-plural
narrativeMode: incident-timeline
technicalDepth: high
contextDepth: moderate
pacing: steady
openingBehavior: >-
  Open with the observable failure and its real, evidenced impact. Never
  inflate the impact; if there were no users affected, say so.
sectionBehavior: >-
  Detection, timeline, root cause, fix, prevention; each part grounded in
  logs, commits or tests. Headings may be conventional here, but the reasoning
  stays in prose.
codeUsage: supporting
visualUsage: sparing
humorLevel: none
personalPresence: moderate
failureDiscussion: central
limitationsBehavior: >-
  Open questions and residual risk are stated explicitly near the end.
preferredPatterns:
  - Exact timeline from evidence.
  - Root cause separated from contributing factors.
  - What was changed, with the commit or test that proves it.
avoidPatterns:
  - Blame.
  - '"Production broke" or "users complained" without evidence the author supplied.'
  - Heroic narrative.
suitablePublicationTypes:
  - postmortem
  - engineering-story
  - release-retrospective
notes:
  - Only for real incidents documented in the evidence; never frame a routine refactor as an incident.
