schemaVersion: 1
id: technical-essay
version: 1.0.0
displayName: Technical essay
description: >-
  An argument about an engineering idea, grounded in the author's project as
  evidence. The thesis leads; the project provides the concrete cases.
perspective: first-person
narrativeMode: argument
technicalDepth: moderate
contextDepth: extensive
pacing: deliberate
openingBehavior: >-
  State the question or claim, then immediately ground it in one concrete case
  from the project.
sectionBehavior: >-
  Sections advance the argument (claim, case, counter-argument, limits of the
  claim), not the project timeline.
codeUsage: sparing
visualUsage: sparing
humorLevel: light
personalPresence: high
failureDiscussion: honest
limitationsBehavior: >-
  Where the argument does not hold is part of the essay, stated explicitly.
preferredPatterns:
  - One clear thesis, labelled as the author's opinion.
  - Concrete cases from the evidence for every general statement.
  - An honest counter-argument.
avoidPatterns:
  - Opinions presented as verified facts.
  - Sweeping industry claims.
  - Rhetorical triads and aphorism chains.
suitablePublicationTypes:
  - engineering-story
  - channel-longread
  - experiment
notes: []
