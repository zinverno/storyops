# Built-in article style preset. Copy it to .editorial/styles/<new-id>.yaml
# (with a new id) to customise; no code changes are needed.
schemaVersion: 1
id: engineering-story
version: 1.0.0
displayName: Engineering story
description: >-
  The story of a real engineering problem and what it changed in the design,
  told by the developer who solved it. Technical details live inside the
  narrative instead of being listed next to it.
perspective: first-person
narrativeMode: problem-driven
technicalDepth: high
contextDepth: moderate
pacing: steady
openingBehavior: >-
  Open on the concrete engineering conflict (a symptom, a wrong result, a
  design that stopped fitting) before any project history. Context comes after
  the reader knows why it matters.
sectionBehavior: >-
  Sections follow the movement of the problem (symptom, first attempt,
  friction, discovery, design consequence), not the fields of the canonical
  story. Headings name what happens, not "Problem" / "Solution".
codeUsage: supporting
visualUsage: supporting
humorLevel: light
personalPresence: moderate
failureDiscussion: honest
limitationsBehavior: >-
  Limitations appear where they naturally bite in the story; a short closing
  note may collect what is still open. No limitation dump at the end.
preferredPatterns:
  - The real conflict appears early.
  - "problem → attempt → friction → discovery → design consequence, when the evidence supports that sequence"
  - Code and diagrams prove a point in the story; they are not inventory.
  - First-person commentary on decisions the author actually made.
  - One central technical episode told slowly and precisely.
avoidPatterns:
  - Architecture inventory ("module A does X, module B does Y").
  - Release-notes or README tone.
  - Section titles copied from story.json fields.
  - Invented tension, emotions or incidents.
  - Generic introductions about the industry.
suitablePublicationTypes:
  - engineering-story
  - architecture-deep-dive
  - migration-story
  - refactor-story
  - experiment
  - channel-longread
notes:
  - The default for long-form Habr articles about the author's own project.
