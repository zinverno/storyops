# Built-in review profile. StoryOps uses it to REVIEW a human-written draft;
# it never generates prose in this style. Copy to .storyops/review-profiles/<new-id>.yaml
# (with a new id) to customise; no code changes are needed.
schemaVersion: 2
id: engineering-story
version: 2.0.0
displayName: Engineering story
description: >-
  The story of a real engineering problem and what it changed in the design, told by the developer who solved it. Technical details live inside the narrative instead of being listed next to it.
expectations:
  firstPerson: expected
  flow: problem-driven
  conflictEarly: true
  technicalDepth: high
  codeRole: supporting
  limitations: expected
  documentationRisk: warn
watchFor:
  - "Architecture inventory (\"module A does X, module B does Y\")."
  - "Release-notes or README tone."
  - "Invented tension, emotions or incidents."
  - "Generic introductions about the industry."
publicationTypes:
  - engineering-story
  - architecture-deep-dive
  - migration-story
  - refactor-story
  - experiment
  - channel-longread
notes:
  - Expectations are review context. A finding based on them is a suggestion; the author decides.
