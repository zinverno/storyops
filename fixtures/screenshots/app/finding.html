<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Finding (fixture)</title>
<style>body{font-family:system-ui,sans-serif;margin:24px} .finding{border:1px solid #ccd;padding:16px;border-radius:8px;max-width:640px}</style></head>
<body>
  <article class="finding" id="finding">
    <h1>Orphan note: <code>inbox/idea-2025-04.md</code></h1>
    <p>State: <strong id="state">open</strong></p>
    <button id="ack">Acknowledge</button>
  </article>
  <script>
    document.getElementById('ack').addEventListener('click', () => {
      document.getElementById('state').textContent = 'acknowledged';
      document.getElementById('finding').setAttribute('data-loaded', 'true');
    });
  </script>
</body>
</html>
